            const endings = [
                { min: 18, max: 18, title: "🏆 最强兵王", emoji: "🏆", stars: 5, imgKey: 'ending1', desc: "你是这片军训场上的传奇！\n——原来你真会galgame啊！" },
                { min: 15, max: 17, title: "⭐ 优秀新兵", emoji: "⭐", stars: 4, imgKey: 'ending2', desc: "你以出色的表现完成了军训。继续带着这份力量迎接大学生活吧！" },
                { min: 12, max: 14, title: "👍 顺利过关", emoji: "👍", stars: 3, imgKey: 'ending3', desc: "你的军训生活平稳而充实。做得不错，继续加油！" },
                { min: 9, max: 11, title: "🙂 合格新人", emoji: "🙂", stars: 2, imgKey: 'ending4', desc: "你完成了军训的基本要求。以后的路还长，慢慢来。" },
                { min: 5, max: 8, title: "🐟 摸鱼达人", emoji: "🐟", stars: 2, imgKey: 'ending5', desc: "鱼需慢慢摸，心急则味散。你以自己独特的节奏在军训中游刃有余。" },
                { min: 1, max: 4, title: "🌅 路漫修远", emoji: "🌅", stars: 1, imgKey: 'ending6', desc: "路漫漫其修远兮。也许你还没找到自己的节奏，但每一次跌倒都是成长的养分。" },
                { min: 0, max: 0, title: "🌀 盖世奇才", emoji: "🌀", stars: 0, imgKey: 'ending7', desc: "你是传说中的\"反向锦鲤\"。这份\"独特\"，本身就是一种才华。" }
            ];

            let state = {
                score: 0,
                sceneIndex: 0,
                extraTriggered: false,
            };

            const contentEl = document.getElementById('dynamic-content');
            const scoreHud = document.getElementById('score-hud');

            function updateHud(showScore = false) {
                scoreHud.textContent = showScore ? `隐藏计分板 · ${state.score}分` : '隐藏计分板 · ?';
                scoreHud.style.color = showScore ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.3)';
            }

            function renderImage(imgKey) {
                const url = imageUrls[imgKey];
                if (!url || url.trim() === '') {
                    return `
                        <div class="image-container">
                            <div class="image-fallback">📷 此处可插入图片<br><small>（在代码中 imageUrls 里配置文件路径）</small></div>
                        </div>
                    `;
                }
                return `
                    <div class="image-container">
                        <img src="${url}" alt="${imgKey}" 
                             onerror="this.parentElement.innerHTML='<div class=&quot;image-fallback&quot;>📷 图片加载失败：' + '${url}' + '<br><small>请检查文件是否存在</small></div>';">
                    </div>
                `;
            }

            function renderIntro() {
                contentEl.innerHTML = `
                    <div id="scene-title">${gameData.intro.title}</div>
                    ${renderImage('intro')}
                    <div id="narrative-box">${gameData.intro.text}</div>
                    <div style="text-align:center;">
                        <button id="next-btn" onclick="startScenes()">开始军训旅程 →</button>
                    </div>
                `;
                updateHud();
            }

            function renderScene() {
                const scene = gameData.scenes[state.sceneIndex];
                if (!scene) { renderEnding(); return; }
                if (scene.id === 'extra1' && !state.extraTriggered) {
                    state.sceneIndex++;
                    renderScene();
                    return;
                }

                const imgHtml = scene.imgKey ? renderImage(scene.imgKey) : '';
                contentEl.innerHTML = `
                    <div id="scene-title">${scene.title}</div>
                    ${imgHtml}
                    <div id="narrative-box">${scene.text}</div>
                    <div id="choices-area">
                        ${scene.choices.map((c, i) => `
                            <button class="choice-btn" onclick="handleChoice(${i})">
                                <span class="choice-badge">${String.fromCharCode(65 + i)}</span>
                                ${c.text}
                            </button>
                        `).join('')}
                    </div>
                `;
                updateHud();
            }

            window.handleChoice = function(idx) {
                const scene = gameData.scenes[state.sceneIndex];
                const choice = scene.choices[idx];
                state.score += choice.score;

                if (scene.id === 'scene3' && idx === 1) {
                    state.extraTriggered = true;
                    renderConsequence(scene, choice, true);
                    return;
                }
                renderConsequence(scene, choice, false);
            };

            function renderConsequence(scene, choice, goExtra) {
                contentEl.innerHTML = `
                    <div id="scene-title">${scene.title}</div>
                    <div id="narrative-box">${choice.consequence}</div>
                    <div id="consequence-panel">💡 <strong>【后果】</strong> ${choice.consequence}</div>
                    <div style="text-align:center;">
                        <button id="next-btn" onclick="advance(${goExtra})">继续 →</button>
                    </div>
                `;
                updateHud();
            }

            window.advance = function(goExtra) {
                if (goExtra) {
                    state.sceneIndex = gameData.scenes.findIndex(s => s.id === 'extra1');
                } else {
                    state.sceneIndex++;
                }
                if (state.sceneIndex >= gameData.scenes.length) {
                    renderEnding();
                } else {
                    renderScene();
                }
            };

            function renderEnding() {
                const ending = endings.find(e => state.score >= e.min && state.score <= e.max);
                const stars = '★'.repeat(ending.stars) + '☆'.repeat(5 - ending.stars);
                contentEl.innerHTML = `
                    <div id="ending-screen">
                        <div id="ending-emoji">${ending.emoji}</div>
                        <div id="ending-title">${ending.title}</div>
                        <div class="star-rating">${stars}</div>
                        <div id="ending-score-text">最终得分：${state.score} 分</div>
                        ${renderImage(ending.imgKey)}
                        <div id="ending-desc">${ending.desc}</div>
                        <div style="margin-top:15px;font-size:0.85rem;color:rgba(255,255,255,0.4);">🎮 本游戏共有7个结局</div>
                        <button id="restart-btn" onclick="restartGame()">🔄 重新开始</button>
                    </div>
                `;
                updateHud(true);
            }

            window.startScenes = function() {
                state.sceneIndex = 0;
                state.extraTriggered = false;
                state.score = 0;
                renderScene();
            };

            window.restartGame = function() {
                state = { score: 0, sceneIndex: 0, extraTriggered: false };
                renderIntro();
            };

            // 启动游戏
            renderIntro();
        })();
    </script>
</body>
</html>
